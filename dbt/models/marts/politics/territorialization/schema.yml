version: 2

models:
  - name: dim_territory
    description: Territory dimension at zone level.

    columns:
      - name: territory_sk
        tests:
          - not_null
          - unique

      - name: state_abbreviation
        tests:
          - not_null

      - name: municipality_id
        tests:
          - not_null

      - name: zone_number
        tests:
          - not_null
  
  - name: dim_party
    description: >
      Dimensão de partidos políticos (TSE),
      modelada como Slowly Changing Dimension Type 2,
      ancorada em election_year.

    columns:
      - name: party_sk
        description: Surrogate key da dimensão
        tests:
          - unique
          - not_null

      - name: party_id
        description: Identificador natural do partido no TSE
        tests:
          - not_null

      - name: election_year
        description: Ano da eleição (âncora temporal da SCD)
        tests:
          - not_null

      - name: party_number
        description: Número oficial do partido

      - name: party_name
        description: Nome completo do partido

      - name: party_abbreviation
        description: Sigla do partido

      - name: party_status
        description: Situação do partido no ano eleitoral

      - name: valid_from
        description: Ano inicial de validade da versão

      - name: valid_to
        description: Ano final de validade da versão

      - name: is_current
        description: Indica se é a versão mais recente do partido

  - name: dim_coalition
    description: >
      Dimension representing electoral coalitions and federations.
      One record represents a unique coalition identity by election year,
      state and coalition name. Party-level relationships are handled
      through bridge tables.

    columns:
      - name: coalition_sk
        description: Surrogate key of the coalition dimension
        tests:
          - not_null
          - unique

      - name: coalition_nk
        description: Natural key derived from election year, state, coalition type and name
        tests:
          - not_null

      - name: coalition_id
        description: >
          Source identifier from TSE (sq_coligacao). Kept for lineage and debugging
          purposes only. Does not define analytical identity.

      - name: coalition_name
        description: Official coalition or federation name
        tests:
          - not_null

      - name: coalition_type
        description: Type of political aggregation
        tests:
          - not_null
          - accepted_values:
              values: ['Coligação', 'Partido Isolado', 'FEDERAÇÃO']

      - name: election_year
        description: Election year in which the coalition is valid
        tests:
          - not_null

      - name: state_abbreviation
        description: State (UF) where the coalition applies
        tests:
          - not_null

      - name: created_at
        description: Timestamp when the record was created

      - name: updated_at
        description: Timestamp when the record was last updated

  - name: dim_party_coalition
    description: >
      Dimensão que representa a relação entre partidos e coalizões eleitorais,
      contextualizada por eleição, turno e UF.
      Cada linha representa um partido participante de uma coalizão
      (ou partido isolado) em um determinado turno eleitoral.

    columns:

      - name: coalizao_partido_sk
        description: Surrogate key da dimensão.
        tests:
          - not_null
          - unique

      - name: election_year
        description: Ano da eleição.
        tests:
          - not_null

      - name: election_round
        description: Turno da eleição.
        tests:
          - not_null
          
      - name: state_abbreviation
        description: Sigla da UF.
        tests:
          - not_null

      - name: party_id
        description: Código do partido político no TSE.
        tests:
          - not_null

      - name: coalition_id
        description: Identificador técnico da coalizão no TSE.
        tests:
          - not_null

      - name: coalition_type
        description: Tipo da agremiação eleitoral.
        tests:
          - not_null
          - accepted_values:
              values:
                - Coligação
                - Partido Isolado
                - Federação
      - name: federation_id
        description: Identificador da federação, quando aplicável.
      - name: federation_name
        description: Nome da federação, quando aplicável.
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: uq_dim_coalizao_partido_grain
          combination_of_columns:
            - election_year
            - election_round
            - state_abbreviation
            - coalition_id
            - party_id
            - coalition_name
            - coalition_decomp
  
  - name: dim_office
    description: "Dimensão canônica de cargos eletivos."
    columns:
        - name: office_key
          tests: [unique, not_null]
        - name: office_id
          tests: [unique, not_null]
        - name: office_name
          tests: [not_null]

  - name: dim_election
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - election_year
            - election_id
            - election_desc
    columns:
      - name: election_key
        tests:
          - not_null
          - unique

  - name: dim_candidate
    description: >
      Dimensão de candidatos.
      Grain: uma linha por candidato por eleição.

    columns:
      - name: candidate_key
        description: Chave substituta da dimensão de candidatos.
        tests:
          - not_null
          - unique

      - name: election_year
        description: Ano da eleição.
        tests:
          - not_null

      - name: election_id
        description: Identificador da eleição.
        tests:
          - not_null

      - name: candidate_id
        description: Identificador do candidato no TSE.
        tests:
          - not_null

      - name: party_id
        description: Identificador do partido do candidato na eleição.
        tests:
          - not_null

      - name: office_id
        description: Código do cargo disputado.
        tests:
          - not_null

  - name: fct_votacao_nominal
    description: >
      Fato de votação nominal consolidada, no nível de
      eleição, candidato, cargo, coligação e território.

    columns:
      - name: election_key
        description: FK para dim_election
        tests:
          - not_null
          - relationships:
              to: ref('dim_election')
              field: election_key

      - name: candidate_key
        description: FK para dim_candidate
        tests:
          - not_null
          - relationships:
              to: ref('dim_candidate')
              field: candidate_key

      - name: office_key
        description: FK para dim_office
        tests:
          - not_null
          - relationships:
              to: ref('dim_office')
              field: office_key

      - name: coalition_key
        description: FK para dim_party_coalition
        tests:
          - relationships:
              to: ref('dim_party_coalition')
              field: coalizao_partido_sk

      - name: territory_key
        description: FK para dim_territory
        tests:
          - not_null
          - relationships:
              to: ref('dim_territory')
              field: territory_sk

      - name: qty_nominal_votes
        description: Quantidade de votos nominais
        tests:
          - not_null

      - name: qty_valid_votes
        description: Quantidade de votos válidos
        tests:
          - not_null
