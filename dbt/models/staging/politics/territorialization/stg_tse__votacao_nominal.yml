version: 2

models:
  - name: stg_tse__votacao_nominal
    description: "Staging da votação nominal do TSE por candidato, município e zona"

    columns:
      - name: election_year
        description: "Ano da eleição"
        tests:
          - not_null

      - name: election_date
        description: "Data oficial da eleição"
        tests:
          - not_null

      - name: candidate_id
        description: "Identificador único do candidato (SQ_CANDIDATO)"
        tests:
          - not_null

      - name: candidate_nr
        description: "Número de urna do candidato"
        tests:
          - not_null

      - name: municipality_id
        description: "Identificador do município (IBGE/TSE)"
        tests:
          - not_null

      - name: qty_votes
        description: "Quantidade de votos nominais"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: state_abbreviation
        description: "Sigla da UF"
        tests:
          - not_null

      - name: candidate_ballot_name
        description: "Nome do candidato como aparece na urna"
        tests:
          - not_null
      - name: election_round
        description: "Número do turno da eleição"
        tests:
          - not_null
      - name: office_id
        description: "Identificador do cargo (CD_CARGO)"
        tests:
          - not_null
      - name: office_name
        description: "Descrição do cargo (DS_CARGO)"
        tests:
          - not_null